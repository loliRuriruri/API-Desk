name: Temporary Hangang APK Builder
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'hangang_day_android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hangang_day_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail
          ls "$ANDROID_HOME/build-tools" | tail
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hangang-day-planner-apk
          path: hangang_day_android/app/build/outputs/apk/debug/app-debug.apk
